name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip curl shellcheck
      - name: Lint (shellcheck --severity=error, two invocations)
        run: |
          shellcheck --severity=error bin/cac lib/*.sh install.sh uninstall.sh
          shellcheck --severity=error tests/*.sh
      - name: Run test suite
        run: ./tests/run_tests.sh
